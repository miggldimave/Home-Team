// ===== frames/ios-frame.jsx =====

// iOS.jsx — Simplified iOS 26 (Liquid Glass) device frame
// Based on the iOS 26 UI Kit + Figma status bar spec. No assets, no deps.
// Exports: IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard

// ─────────────────────────────────────────────────────────────
// Status bar
// ─────────────────────────────────────────────────────────────
function IOSStatusBar({ dark = false, time = '9:41' }) {
  const c = dark ? '#fff' : '#000';
  return (
    <div style={{
      display: 'flex', gap: 154, alignItems: 'center', justifyContent: 'center',
      padding: '21px 24px 19px', boxSizing: 'border-box',
      position: 'relative', zIndex: 20, width: '100%',
    }}>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', paddingTop: 1.5 }}>
        <span style={{
          fontFamily: '-apple-system, "SF Pro", system-ui', fontWeight: 590,
          fontSize: 17, lineHeight: '22px', color: c,
        }}>{time}</span>
      </div>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7, paddingTop: 1, paddingRight: 1 }}>
        <svg width="19" height="12" viewBox="0 0 19 12">
          <rect x="0" y="7.5" width="3.2" height="4.5" rx="0.7" fill={c}/>
          <rect x="4.8" y="5" width="3.2" height="7" rx="0.7" fill={c}/>
          <rect x="9.6" y="2.5" width="3.2" height="9.5" rx="0.7" fill={c}/>
          <rect x="14.4" y="0" width="3.2" height="12" rx="0.7" fill={c}/>
        </svg>
        <svg width="17" height="12" viewBox="0 0 17 12">
          <path d="M8.5 3.2C10.8 3.2 12.9 4.1 14.4 5.6L15.5 4.5C13.7 2.7 11.2 1.5 8.5 1.5C5.8 1.5 3.3 2.7 1.5 4.5L2.6 5.6C4.1 4.1 6.2 3.2 8.5 3.2Z" fill={c}/>
          <path d="M8.5 6.8C9.9 6.8 11.1 7.3 12 8.2L13.1 7.1C11.8 5.9 10.2 5.1 8.5 5.1C6.8 5.1 5.2 5.9 3.9 7.1L5 8.2C5.9 7.3 7.1 6.8 8.5 6.8Z" fill={c}/>
          <circle cx="8.5" cy="10.5" r="1.5" fill={c}/>
        </svg>
        <svg width="27" height="13" viewBox="0 0 27 13">
          <rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke={c} strokeOpacity="0.35" fill="none"/>
          <rect x="2" y="2" width="20" height="9" rx="2" fill={c}/>
          <path d="M25 4.5V8.5C25.8 8.2 26.5 7.2 26.5 6.5C26.5 5.8 25.8 4.8 25 4.5Z" fill={c} fillOpacity="0.4"/>
        </svg>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Liquid glass pill — blur + tint + shine
// ─────────────────────────────────────────────────────────────
function IOSGlassPill({ children, dark = false, style = {} }) {
  return (
    <div style={{
      height: 44, minWidth: 44, borderRadius: 9999,
      position: 'relative', overflow: 'hidden',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      boxShadow: dark
        ? '0 2px 6px rgba(0,0,0,0.35), 0 6px 16px rgba(0,0,0,0.2)'
        : '0 1px 3px rgba(0,0,0,0.07), 0 3px 10px rgba(0,0,0,0.06)',
      ...style,
    }}>
      {/* blur + tint */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.28)' : 'rgba(255,255,255,0.5)',
      }} />
      {/* shine */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15), inset -1px -1px 1px rgba(255,255,255,0.08)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
      }} />
      <div style={{ position: 'relative', zIndex: 1, display: 'flex', alignItems: 'center', padding: '0 4px' }}>
        {children}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Navigation bar — glass pills + large title
// ─────────────────────────────────────────────────────────────
function IOSNavBar({ title = 'Title', dark = false, trailingIcon = true }) {
  const muted = dark ? 'rgba(255,255,255,0.6)' : '#404040';
  const text = dark ? '#fff' : '#000';
  const pillIcon = (content) => (
    <IOSGlassPill dark={dark}>
      <div style={{ width: 36, height: 36, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        {content}
      </div>
    </IOSGlassPill>
  );
  return (
    <div style={{
      display: 'flex', flexDirection: 'column', gap: 10,
      paddingTop: 62, paddingBottom: 10, position: 'relative', zIndex: 5,
    }}>
      <div style={{
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        padding: '0 16px',
      }}>
        {/* back chevron */}
        {pillIcon(
          <svg width="12" height="20" viewBox="0 0 12 20" fill="none" style={{ marginLeft: -1 }}>
            <path d="M10 2L2 10l8 8" stroke={muted} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        )}
        {/* trailing ellipsis */}
        {trailingIcon && pillIcon(
          <svg width="22" height="6" viewBox="0 0 22 6">
            <circle cx="3" cy="3" r="2.5" fill={muted}/>
            <circle cx="11" cy="3" r="2.5" fill={muted}/>
            <circle cx="19" cy="3" r="2.5" fill={muted}/>
          </svg>
        )}
      </div>
      {/* large title */}
      <div style={{
        padding: '0 16px',
        fontFamily: '-apple-system, system-ui',
        fontSize: 34, fontWeight: 700, lineHeight: '41px',
        color: text, letterSpacing: 0.4,
      }}>{title}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Grouped list (inset card, r:26) + row (52px)
// ─────────────────────────────────────────────────────────────
function IOSListRow({ title, detail, icon, chevron = true, isLast = false, dark = false }) {
  const text = dark ? '#fff' : '#000';
  const sec = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const ter = dark ? 'rgba(235,235,245,0.3)' : 'rgba(60,60,67,0.3)';
  const sep = dark ? 'rgba(84,84,88,0.65)' : 'rgba(60,60,67,0.12)';
  return (
    <div style={{
      display: 'flex', alignItems: 'center', minHeight: 52,
      padding: '0 16px', position: 'relative',
      fontFamily: '-apple-system, system-ui', fontSize: 17,
      letterSpacing: -0.43,
    }}>
      {icon && (
        <div style={{
          width: 30, height: 30, borderRadius: 7, background: icon,
          marginRight: 12, flexShrink: 0,
        }} />
      )}
      <div style={{ flex: 1, color: text }}>{title}</div>
      {detail && <span style={{ color: sec, marginRight: 6 }}>{detail}</span>}
      {chevron && (
        <svg width="8" height="14" viewBox="0 0 8 14" style={{ flexShrink: 0 }}>
          <path d="M1 1l6 6-6 6" stroke={ter} strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      )}
      {!isLast && (
        <div style={{
          position: 'absolute', bottom: 0, right: 0,
          left: icon ? 58 : 16, height: 0.5, background: sep,
        }} />
      )}
    </div>
  );
}

function IOSList({ header, children, dark = false }) {
  const hc = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const bg = dark ? '#1C1C1E' : '#fff';
  return (
    <div>
      {header && (
        <div style={{
          fontFamily: '-apple-system, system-ui', fontSize: 13,
          color: hc, textTransform: 'uppercase',
          padding: '8px 36px 6px', letterSpacing: -0.08,
        }}>{header}</div>
      )}
      <div style={{
        background: bg, borderRadius: 26,
        margin: '0 16px', overflow: 'hidden',
      }}>{children}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Device frame
// ─────────────────────────────────────────────────────────────
function IOSDevice({
  children, width = 402, height = 874, dark = false,
  title, keyboard = false,
}) {
  return (
    <div style={{
      width, height, borderRadius: 48, overflow: 'hidden',
      position: 'relative', background: dark ? '#000' : '#F2F2F7',
      boxShadow: '0 40px 80px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.12)',
      fontFamily: '-apple-system, system-ui, sans-serif',
      WebkitFontSmoothing: 'antialiased',
    }}>
      {/* dynamic island */}
      <div style={{
        position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)',
        width: 126, height: 37, borderRadius: 24, background: '#000', zIndex: 50,
      }} />
      {/* status bar (absolute) */}
      <div style={{ position: 'absolute', top: 0, left: 0, right: 0, zIndex: 10 }}>
        <IOSStatusBar dark={dark} />
      </div>
      {/* nav + content */}
      <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
        {title !== undefined && <IOSNavBar title={title} dark={dark} />}
        <div style={{ flex: 1, overflow: 'auto' }}>{children}</div>
        {keyboard && <IOSKeyboard dark={dark} />}
      </div>
      {/* home indicator — always on top */}
      <div style={{
        position: 'absolute', bottom: 0, left: 0, right: 0, zIndex: 60,
        height: 34, display: 'flex', justifyContent: 'center', alignItems: 'flex-end',
        paddingBottom: 8, pointerEvents: 'none',
      }}>
        <div style={{
          width: 139, height: 5, borderRadius: 100,
          background: dark ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.25)',
        }} />
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Keyboard — iOS 26 liquid glass
// ─────────────────────────────────────────────────────────────
function IOSKeyboard({ dark = false }) {
  const glyph = dark ? 'rgba(255,255,255,0.7)' : '#595959';
  const sugg = dark ? 'rgba(255,255,255,0.6)' : '#333';
  const keyBg = dark ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.85)';

  // special-key icons
  const icons = {
    shift: <svg width="19" height="17" viewBox="0 0 19 17"><path d="M9.5 1L1 9.5h4.5V16h8V9.5H18L9.5 1z" fill={glyph}/></svg>,
    del: <svg width="23" height="17" viewBox="0 0 23 17"><path d="M7 1h13a2 2 0 012 2v11a2 2 0 01-2 2H7l-6-7.5L7 1z" fill="none" stroke={glyph} strokeWidth="1.6" strokeLinejoin="round"/><path d="M10 5l7 7M17 5l-7 7" stroke={glyph} strokeWidth="1.6" strokeLinecap="round"/></svg>,
    ret: <svg width="20" height="14" viewBox="0 0 20 14"><path d="M18 1v6H4m0 0l4-4M4 7l4 4" fill="none" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  };

  const key = (content, { w, flex, ret, fs = 25, k } = {}) => (
    <div key={k} style={{
      height: 42, borderRadius: 8.5,
      flex: flex ? 1 : undefined, width: w, minWidth: 0,
      background: ret ? '#08f' : keyBg,
      boxShadow: '0 1px 0 rgba(0,0,0,0.075)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontFamily: '-apple-system, "SF Compact", system-ui',
      fontSize: fs, fontWeight: 458, color: ret ? '#fff' : glyph,
    }}>{content}</div>
  );

  const row = (keys, pad = 0) => (
    <div style={{ display: 'flex', gap: 6.5, justifyContent: 'center', padding: `0 ${pad}px` }}>
      {keys.map(l => key(l, { flex: true, k: l }))}
    </div>
  );

  return (
    <div style={{
      position: 'relative', zIndex: 15, borderRadius: 27, overflow: 'hidden',
      padding: '11px 0 2px',
      display: 'flex', flexDirection: 'column', alignItems: 'center',
      boxShadow: dark
        ? '0 -2px 20px rgba(0,0,0,0.09)'
        : '0 -1px 6px rgba(0,0,0,0.018), 0 -3px 20px rgba(0,0,0,0.012)',
    }}>
      {/* liquid glass bg — same recipe as nav pills */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.14)' : 'rgba(255,255,255,0.25)',
      }} />
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
        pointerEvents: 'none',
      }} />

      {/* autocorrect bar */}
      <div style={{
        display: 'flex', gap: 20, alignItems: 'center',
        padding: '8px 22px 13px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {['"The"', 'the', 'to'].map((w, i) => (
          <React.Fragment key={i}>
            {i > 0 && <div style={{ width: 1, height: 25, background: '#ccc', opacity: 0.3 }} />}
            <div style={{
              flex: 1, textAlign: 'center',
              fontFamily: '-apple-system, system-ui', fontSize: 17,
              color: sugg, letterSpacing: -0.43, lineHeight: '22px',
            }}>{w}</div>
          </React.Fragment>
        ))}
      </div>

      {/* key layout */}
      <div style={{
        display: 'flex', flexDirection: 'column', gap: 13,
        padding: '0 6.5px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {row(['q','w','e','r','t','y','u','i','o','p'])}
        {row(['a','s','d','f','g','h','j','k','l'], 20)}
        <div style={{ display: 'flex', gap: 14.25, alignItems: 'center' }}>
          {key(icons.shift, { w: 45, k: 'shift' })}
          <div style={{ display: 'flex', gap: 6.5, flex: 1 }}>
            {['z','x','c','v','b','n','m'].map(l => key(l, { flex: true, k: l }))}
          </div>
          {key(icons.del, { w: 45, k: 'del' })}
        </div>
        <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
          {key('ABC', { w: 92.25, fs: 18, k: 'abc' })}
          {key('', { flex: true, k: 'space' })}
          {key(icons.ret, { w: 92.25, ret: true, k: 'ret' })}
        </div>
      </div>

      {/* bottom spacer (emoji+mic area, icons omitted) */}
      <div style={{ height: 56, width: '100%', position: 'relative' }} />
    </div>
  );
}

Object.assign(window, {
  IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard,

// Repetition frequency labels (weekly / bi-weekly etc.) for UX
function freqLabel(cycle) {
  if (cycle <= 1) return 'täglich';
  if (cycle <= 3) return 'alle paar Tage';
  if (cycle <= 7) return 'wöchentlich';
  if (cycle <= 14) return 'alle 2 Wochen';
  if (cycle <= 31) return 'monatlich';
  if (cycle <= 60) return 'alle 2 Monate';
  return 'quartalsweise';
}

  const now = Date.now();
  const day = 24 * 60 * 60 * 1000;
  let seed = 137;
  const rand = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };

  // Bias: Marcos dominates Küche (streak). Lotta dominates Bad + Wäsche.
  // Both share Allgemein roughly.
  for (let d = 90; d >= 0; d--) {
    const ts = now - d * day;
    const n = 2 + Math.floor(rand() * 4);
    for (let i = 0; i < n; i++) {
      const task = TASKS[Math.floor(rand() * TASKS.length)];
      let member;
      if (task.cat === 'Küche') member = rand() < 0.82 ? 'marcos' : 'lotta';
      else if (task.cat === 'Bad' || task.cat === 'Wäsche') member = rand() < 0.78 ? 'lotta' : 'marcos';
      else if (task.cat === 'Wohnzimmer') member = rand() < 0.7 ? 'lotta' : 'marcos';
      else member = rand() < 0.52 ? 'lotta' : 'marcos';
      logs.push({
        taskId: task.id, taskName: task.name, cat: task.cat,
        pts: task.pts, time: task.time, memberId: member,
        ts: ts - Math.floor(rand() * day * 0.8),
      });
    }
  }
  return logs.sort((a, b) => b.ts - a.ts);
}

const LOGS = generateLogs();

function lastDoneByTask(logs) {
  const m = {};
  logs.forEach(l => { if (!m[l.taskId] || l.ts > m[l.taskId]) m[l.taskId] = l; });
  return m;
}

// Streak per task: consecutive times same person did it (most recent first)
function taskStreak(logs, taskId) {
  const filtered = logs.filter(l => l.taskId === taskId).sort((a, b) => b.ts - a.ts);
  if (filtered.length === 0) return { member: null, count: 0 };
  const who = filtered[0].memberId;
  let c = 0;
  for (const l of filtered) {
    if (l.memberId === who) c++;
    else break;
  }
  return { member: who, count: c };
}

// Category streak: how many consecutive task-logs in category by same member
function categoryStreak(logs, cat) {
  const filtered = logs.filter(l => l.cat === cat).sort((a, b) => b.ts - a.ts);
  if (filtered.length === 0) return { member: null, count: 0, coverage: 0, days: 0 };
  const who = filtered[0].memberId;
  let c = 0;
  for (const l of filtered) {
    if (l.memberId === who) c++;
    else break;
  }
  // coverage this month
  const monthAgo = Date.now() - 30 * 86400000;
  const thisMonth = filtered.filter(l => l.ts >= monthAgo);
  const byWho = thisMonth.filter(l => l.memberId === who).length;
  const coverage = thisMonth.length > 0 ? byWho / thisMonth.length : 0;
  // days since first in current streak
  const streakLogs = filtered.slice(0, c);
  const oldestStreak = streakLogs.length > 0 ? streakLogs[streakLogs.length - 1].ts : Date.now();
  const days = Math.floor((Date.now() - oldestStreak) / 86400000);
  return { member: who, count: c, coverage, days };
}

// Quota: how much of the household's monthly expected workload is done
function monthlyQuota(logs) {
  // Expected: sum of time across all tasks scaled by (30/cycle) for the month
  const expected = TASKS.reduce((s, t) => s + (t.time * (30 / t.cycle)), 0);
  const monthAgo = Date.now() - 30 * 86400000;
  const done = logs.filter(l => l.ts >= monthAgo).reduce((s, l) => s + l.time, 0);
  return { done, expected: Math.round(expected), pct: Math.min(1, done / expected) };
}

function timeByMember(logs, uid, since) {
  return logs.filter(l => l.memberId === uid && l.ts >= since).reduce((s, l) => s + l.time, 0);
}

function formatMinutes(min) {
  if (min < 60) return `${min}min`;
  const h = Math.floor(min / 60);
  const m = min % 60;
  if (m === 0) return `${h}h`;
  return `${h}h ${m}min`;
}

function timeAgo(ts) {
  const diff = Date.now() - ts;
  const days = Math.floor(diff / 86400000);
  if (days === 0) return 'heute';
  if (days === 1) return 'gestern';
  if (days < 7) return `vor ${days} Tagen`;
  if (days < 14) return 'letzte Woche';
  if (days < 60) return `vor ${Math.floor(days/7)} Wochen`;
  return `vor ${Math.floor(days/30)} Monaten`;
}

// Find tasks where Member A has been doing all the work (streak >= 3)
function entlastungCandidates(logs, otherUser) {
  return TASKS.map(t => {
    const s = taskStreak(logs, t.id);
    return { ...t, streak: s };
  }).filter(t => t.streak.count >= 3 && t.streak.member !== otherUser)
    .sort((a, b) => b.streak.count - a.streak.count);
}

Object.assign(window, {
  CATEGORIES, TASKS, TASK_ICONS, MEMBERS, LOGS,
  freqLabel, lastDoneByTask, taskStreak, categoryStreak, monthlyQuota,
  timeByMember, formatMinutes, timeAgo, entlastungCandidates,
});

function TaskRow({ task, dark, onComplete, onOpen, state, hideFlame = false }) {
  const streak = window.taskStreak(state.logs, task.id);
  const lastDoneBy = streak.member ? window.MEMBERS.find(m => m.id === streak.member) : null;
  const cat = window.CATEGORIES[task.cat];
  const [done, setDone] = React.useState(false);
  const [pressed, setPressed] = React.useState(false);

  const handle = (e) => {
    e.stopPropagation();
    if (done) return;
    setDone(true);
    setTimeout(() => onComplete(task), 280);
  };

  const txt = dark ? '#F2ECE4' : '#2A221E';
  const muted = dark ? 'rgba(242,236,228,0.55)' : 'rgba(42,34,30,0.55)';
  const lastTxt = task.last ? window.timeAgo(task.last.ts) : 'noch nie';

  return (
    <div onClick={() => onOpen && onOpen(task)} style={{
      background: dark ? 'rgba(50,40,44,0.6)' : 'rgba(255,255,255,0.75)',
      borderRadius: 20, padding: '12px 14px',
      display: 'flex', alignItems: 'center', gap: 12,
      border: dark ? '1px solid rgba(255,255,255,0.05)' : '1px solid rgba(0,0,0,0.04)',
      backdropFilter: 'blur(12px)', WebkitBackdropFilter: 'blur(12px)',
      opacity: done ? 0.45 : 1, cursor: 'pointer',
      transform: done ? 'scale(0.98)' : 'scale(1)',
      transition: 'all 0.3s cubic-bezier(.2,.8,.2,1)',
    }}>
      <TaskIconTile task={task} size={42}/>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{
          fontFamily: 'Geist, system-ui', fontSize: 15, fontWeight: 500,
          color: txt, letterSpacing: -0.15,
          textDecoration: done ? 'line-through' : 'none',
        }}>{task.name}</div>
        <div style={{
          marginTop: 3, display: 'flex', alignItems: 'center', gap: 6,
          fontSize: 11.5, color: muted, fontFamily: 'Geist, system-ui',
        }}>
          <span style={{ display: 'inline-flex', alignItems: 'center', gap: 3 }}>
            {Icons.clock(11, muted)} {window.formatMinutes(task.time)}
          </span>
          <span>·</span>
          <span>zuletzt {lastTxt}</span>
          {!hideFlame && lastDoneBy && streak.count >= 2 && (
            <>
              <span>·</span>
              <span style={{ display: 'inline-flex', alignItems: 'center', gap: 3, color: lastDoneBy.color, fontWeight: 600 }}>
                <Flame size={10} color={lastDoneBy.color}/>
                {lastDoneBy.name} ×{streak.count}
              </span>
            </>
          )}
        </div>
      </div>
      <button
        onMouseDown={() => setPressed(true)}
        onMouseUp={() => setPressed(false)}
        onMouseLeave={() => setPressed(false)}
        onClick={handle}
        style={{
          border: 'none', cursor: 'pointer',
          width: 38, height: 38, borderRadius: '50%',
          background: done ? 'rgb(138, 170, 138)' : cat.hue,
          color: 'white', display: 'flex', alignItems: 'center', justifyContent: 'center',
          transform: pressed ? 'scale(0.92)' : 'scale(1)',
          transition: 'transform 0.15s, background 0.3s',
          flexShrink: 0,
        }}
      >
        {Icons.check(18, 'white', 2.6)}
      </button>
    </div>
  );
}

        </div>

        <div style={{
          marginTop: 14, fontFamily: 'Geist, system-ui', fontSize: 14,
          color: muted, lineHeight: 1.5,

        {/* Meta strip */}
        <div style={{ display: 'flex', gap: 8, marginTop: 14, flexWrap: 'wrap' }}>
          <Pill bg={dark ? 'rgba(255,255,255,0.06)' : 'rgba(255,255,255,0.7)'} fg={txt}
            style={{ padding: '6px 12px' }}>
            {Icons.clock(12, txt)} <span>{window.formatMinutes(task.time)}</span>
          </Pill>
          <Pill bg={dark ? 'rgba(255,255,255,0.06)' : 'rgba(255,255,255,0.7)'} fg={txt}
            style={{ padding: '6px 12px' }}>
            {Icons.repeat(12, txt)} <span>{window.freqLabel(task.cycle)}</span>
          </Pill>
        </div>
      </div>

      {/* Streak highlight */}
      {streak.count >= 2 && streakMember && (
        <div style={{ padding: '16px 16px 0' }}>
          <div style={{
            padding: '16px 18px', borderRadius: 22,
            background: cardBg, border: cardBorder,
            display: 'flex', alignItems: 'center', gap: 14,

                position: 'absolute', bottom: -2, right: -2,
                background: dark ? 'rgb(28,22,26)' : 'rgb(253,248,241)', borderRadius: '50%',
                width: 22, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center',
                boxShadow: '0 1px 2px rgba(0,0,0,0.08)',

                <Flame size={13} color={streakMember.color}/>
              </div>
            </div>
            <div style={{ flex: 1 }}>
              <div style={{
                fontFamily: '"Instrument Serif", Georgia, serif', fontSize: 18,
                color: txt, letterSpacing: -0.2, lineHeight: 1.3,

                <em>{streakMember.name}</em> hat das die letzten <em>{streak.count}×</em> gemacht
              </div>
              <div style={{
                fontFamily: 'Geist, system-ui', fontSize: 12, color: muted, marginTop: 3,
              }}>
                {streakMember.id !== currentUser
                  ? 'Zeit, ihm/ihr den Rücken frei zu halten?'

            </div>
            {streakMember.id !== currentUser && (
              <button onClick={() => onKudos(streakMember, task)} style={{
                border: 'none', cursor: 'pointer', width: 38, height: 38, borderRadius: '50%',
                background: me.bg,
                display: 'flex', alignItems: 'center', justifyContent: 'center',
              }}>
                <Heart size={18} filled color={me.color}/>
              </button>

        </div>
      )}

      {/* History */}
      <div style={{ marginTop: 20 }}>
        <div style={{
          padding: '0 24px 10px',
          fontFamily: '"Instrument Serif", Georgia, serif', fontSize: 22,
          color: txt, letterSpacing: -0.2,
        }}>Verlauf</div>

        <div style={{ padding: '0 16px' }}>
          <div style={{
            background: cardBg, border: cardBorder, borderRadius: 20, overflow: 'hidden',
          }}>
            {history.length === 0 && (
              <div style={{
                padding: 20, textAlign: 'center',
                fontFamily: '"Instrument Serif", Georgia, serif', fontSize: 16,
                color: muted, fontStyle: 'italic',
              }}>noch keine Einträge</div>
            )}
            {history.map((l, i) => {
              const m = window.MEMBERS.find(mm => mm.id === l.memberId);
              return (
                <div key={i} style={{
                  padding: '12px 14px',
                  display: 'flex', alignItems: 'center', gap: 12,
                  borderTop: i > 0 ? (dark ? '1px solid rgba(255,255,255,0.04)' : '1px solid rgba(0,0,0,0.04)') : 'none',
                }}>
                  <Avatar member={m} size={32}/>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{
                      fontFamily: 'Geist, system-ui', fontSize: 14, fontWeight: 500,
                      color: txt, letterSpacing: -0.1,

                    <div style={{
                      fontSize: 11, color: muted, fontFamily: 'Geist, system-ui', marginTop: 2,
                    }}>{window.timeAgo(l.ts)}</div>
                  </div>
                  <div style={{
                    fontFamily: 'Geist, system-ui', fontSize: 12, color: muted,
                  }}>{window.formatMinutes(l.time)}</div>

          </div>
        </div>
      </div>

      {/* Primary CTA */}
      <div style={{
        position: 'sticky', bottom: 82, zIndex: 40, padding: '16px 16px 0',
      }}>
        <button onClick={handleDone} disabled={done} style={{
          width: '100%', border: 'none', cursor: done ? 'default' : 'pointer',
          padding: '16px 20px', borderRadius: 20,
          background: done ? 'rgb(138, 170, 138)' : cat.hue, color: '#fff',
          fontFamily: 'Geist, system-ui', fontSize: 15, fontWeight: 600,
          display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8,
          boxShadow: `0 6px 18px ${cat.hue.replace('rgb', 'rgba').replace(')', ', 0.32)')}`,
          letterSpacing: -0.1,
          transition: 'all 0.25s cubic-bezier(.2,.8,.2,1)',
          transform: done ? 'scale(0.98)' : 'scale(1)',
        }}>
          {Icons.check(20, '#fff', 2.6)}
          {done ? 'Erledigt' : `Erledigt · ${window.formatMinutes(task.time)}`}
        </button>
      </div>
    </div>
  );
}

// Analytics / Transparenz — neutral balance view

function AnalyticsScreen({ state }) {
  const dark = state.dark;
  const monthAgo = Date.now() - 30 * 86400000;
  const [lotta, marcos] = window.MEMBERS;
  const lottaTime = window.timeByMember(state.logs, 'lotta', monthAgo);
  const marcosTime = window.timeByMember(state.logs, 'marcos', monthAgo);
  const total = lottaTime + marcosTime || 1;

  // Time by category, by member
  const byCat = {};
  Object.keys(window.CATEGORIES).forEach(c => {
    byCat[c] = { lotta: 0, marcos: 0 };
  });
  state.logs.filter(l => l.ts >= monthAgo).forEach(l => {
    byCat[l.cat][l.memberId] += l.time;
  });

  // Last 14 days bar trend (total per day)
  const days = [];
  for (let d = 13; d >= 0; d--) {
    const start = Date.now() - d * 86400000;
    const s = new Date(start); s.setHours(0,0,0,0);
    const ds = s.getTime(); const de = ds + 86400000;
    const lt = state.logs.filter(l => l.memberId === 'lotta' && l.ts >= ds && l.ts < de).reduce((a,l) => a+l.time, 0);
    const mt = state.logs.filter(l => l.memberId === 'marcos' && l.ts >= ds && l.ts < de).reduce((a,l) => a+l.time, 0);
    days.push({ ds, lt, mt });
  }
  const maxDay = Math.max(...days.map(d => d.lt + d.mt), 1);

  const txt = dark ? '#F2ECE4' : '#2A221E';
  const muted = dark ? 'rgba(242,236,228,0.55)' : 'rgba(42,34,30,0.55)';
  const cardBg = dark ? 'rgba(50,40,44,0.75)' : 'rgba(255,255,255,0.78)';
  const cardBorder = dark ? '1px solid rgba(255,255,255,0.05)' : '1px solid rgba(0,0,0,0.04)';

  const lottaPct = lottaTime / total;
  const marcosPct = marcosTime / total;

  return (
    <div style={{ paddingBottom: 140 }}>
      <div style={{ padding: '60px 24px 0' }}>
        <div style={{
          fontFamily: 'Geist, system-ui', fontSize: 12, fontWeight: 500,
          color: muted, letterSpacing: 0.5, textTransform: 'uppercase',
        }}>Transparenz · 30 Tage</div>
        <div style={{
          fontFamily: '"Instrument Serif", Georgia, serif', fontSize: 40,
          lineHeight: 1.05, letterSpacing: -0.5, color: txt, marginTop: 4,
        }}>Balance</div>
      </div>

      {/* Balance bar — neutral visualization */}
      <div style={{
        margin: '22px 16px 0', padding: '20px', borderRadius: 24,
        background: cardBg, border: cardBorder,
      }}>
        <div style={{
          fontFamily: 'Geist, system-ui', fontSize: 12, fontWeight: 600,
          color: muted, textTransform: 'uppercase', letterSpacing: 0.5, marginBottom: 14,
        }}>Mental Load</div>

        <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
          <div style={{ flex: 1, textAlign: 'right' }}>
            <div style={{
              fontFamily: '"Instrument Serif", Georgia, serif', fontSize: 28,
              color: txt, letterSpacing: -0.3, lineHeight: 1,
            }}>{window.formatMinutes(lottaTime)}</div>
            <div style={{ fontSize: 12, color: muted, fontFamily: 'Geist, system-ui', marginTop: 4 }}>{lotta.name}</div>
          </div>
          <div style={{
            width: 1, height: 52, background: dark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.08)',
          }}/>
          <div style={{ flex: 1 }}>
            <div style={{
              fontFamily: '"Instrument Serif", Georgia, serif', fontSize: 28,
              color: txt, letterSpacing: -0.3, lineHeight: 1,
            }}>{window.formatMinutes(marcosTime)}</div>
            <div style={{ fontSize: 12, color: muted, fontFamily: 'Geist, system-ui', marginTop: 4 }}>{marcos.name}</div>
          </div>
        </div>

        <div style={{ marginTop: 18, position: 'relative' }}>
          <div style={{
            height: 14, borderRadius: 7, display: 'flex', overflow: 'hidden',
            background: dark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.04)',
          }}>
            <div style={{ width: `${lottaPct*100}%`, background: lotta.color, transition: 'width 0.8s' }}/>
            <div style={{ width: `${marcosPct*100}%`, background: marcos.color, transition: 'width 0.8s' }}/>
          </div>
          <div style={{
            position: 'absolute', top: -2, left: '50%', transform: 'translateX(-50%)',
            width: 2, height: 18, background: dark ? 'rgba(255,255,255,0.3)' : 'rgba(0,0,0,0.25)',
          }}/>
        </div>
        <div style={{
          marginTop: 10, fontFamily: '"Instrument Serif", Georgia, serif', fontSize: 16,
          color: muted, letterSpacing: -0.1, textAlign: 'center', fontStyle: 'italic',
        }}>
          {Math.abs(lottaPct - 0.5) < 0.08
            ? 'ziemlich ausgeglichen.'
            : `${lottaPct > marcosPct ? lotta.name : marcos.name} trägt gerade mehr.`}
        </div>
      </div>

      {/* Category breakdown */}
      <div style={{ margin: '22px 16px 0', padding: '20px', borderRadius: 24, background: cardBg, border: cardBorder }}>
        <div style={{
          fontFamily: 'Geist, system-ui', fontSize: 12, fontWeight: 600,
          color: muted, textTransform: 'uppercase', letterSpacing: 0.5, marginBottom: 12,
        }}>Zeit nach Bereich</div>
        {Object.entries(byCat).map(([c, v]) => {
          const t = v.lotta + v.marcos;
          if (t === 0) return null;
          const lp = v.lotta / t, mp = v.marcos / t;
          return (
            <div key={c} style={{ marginTop: 12 }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 6 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                  <CategoryOrb cat={c} size={18}/>
                  <span style={{ fontFamily: 'Geist, system-ui', fontSize: 13, color: txt, fontWeight: 500 }}>{c}</span>
                </div>
                <span style={{ fontFamily: 'Geist, system-ui', fontSize: 12, color: muted }}>{window.formatMinutes(t)}</span>
              </div>
              <div style={{
                height: 8, borderRadius: 4, overflow: 'hidden', display: 'flex',
                background: dark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.04)',
              }}>
                <div style={{ width: `${lp*100}%`, background: lotta.color }}/>
                <div style={{ width: `${mp*100}%`, background: marcos.color }}/>
              </div>
            </div>
          );
        })}
      </div>

      {/* 14-day trend */}
      <div style={{ margin: '22px 16px 0', padding: '20px', borderRadius: 24, background: cardBg, border: cardBorder }}>
        <div style={{
          fontFamily: 'Geist, system-ui', fontSize: 12, fontWeight: 600,
          color: muted, textTransform: 'uppercase', letterSpacing: 0.5, marginBottom: 12,
        }}>Letzte 14 Tage · gemeinsam</div>
        <div style={{ display: 'flex', alignItems: 'flex-end', gap: 4, height: 100 }}>
          {days.map((d, i) => {
            const lh = (d.lt / maxDay) * 100;
            const mh = (d.mt / maxDay) * 100;
            return (
              <div key={i} style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 1, justifyContent: 'flex-end' }}>
                <div style={{ height: `${mh}%`, background: marcos.color, borderRadius: '3px 3px 0 0', minHeight: mh > 0 ? 2 : 0 }}/>
                <div style={{ height: `${lh}%`, background: lotta.color, borderRadius: mh > 0 ? '0 0 3px 3px' : '3px', minHeight: lh > 0 ? 2 : 0 }}/>
              </div>
            );
          })}
        </div>
        <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 8,
          fontFamily: 'Geist, system-ui', fontSize: 10, color: muted }}>
          <span>vor 14T</span><span>heute</span>
        </div>
      </div>
    </div>
  );
}

Object.assign(window, { AnalyticsScreen });


// ===== app.jsx =====
// Home-Team — Main app shell

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "darkMode": false,
  "currentUser": "lotta",
  "showDesktop": false
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweaks] = React.useState(TWEAK_DEFAULTS);
  const [editMode, setEditMode] = React.useState(false);
  const [screen, setScreen] = React.useState(() => localStorage.getItem('ht-screen') || 'home');
  const [openTask, setOpenTask] = React.useState(null);
  const [logs, setLogs] = React.useState(window.LOGS);
  const [showPetals, setShowPetals] = React.useState(false);
  const [showHearts, setShowHearts] = React.useState(false);
  const [toast, setToast] = React.useState(null);

  React.useEffect(() => { localStorage.setItem('ht-screen', screen); }, [screen]);

  React.useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setEditMode(true);
      else if (e.data?.type === '__deactivate_edit_mode') setEditMode(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  const updateTweak = (k, v) => {
    const next = { ...tweaks, [k]: v };
    setTweaks(next);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [k]: v } }, '*');
  };

  const state = { logs, dark: tweaks.darkMode };

  const handleComplete = (task) => {
    const me = window.MEMBERS.find(m => m.id === tweaks.currentUser);
    const newLog = {
      taskId: task.id, taskName: task.name, cat: task.cat,
      pts: task.pts, time: task.time, memberId: tweaks.currentUser, ts: Date.now(),
    };
    setLogs(prev => [newLog, ...prev]);
    setShowPetals(true);
    setTimeout(() => setShowPetals(false), 2500);
    setToast({ kind: 'done', task: task.name, time: task.time, color: window.CATEGORIES[task.cat].hue });
    setTimeout(() => setToast(null), 2600);
    if (openTask && openTask.id === task.id) setOpenTask(null);
  };

  const handleKudos = (toMember, task) => {
    setShowHearts(true);
    setTimeout(() => setShowHearts(false), 2200);
    setToast({ kind: 'kudos', name: toMember.name, task: task.name, color: toMember.color });
    setTimeout(() => setToast(null), 2600);
  };

  const renderScreen = () => {
    if (openTask) return (
      <TaskDetailScreen state={state} task={openTask}
        onComplete={handleComplete} onBack={() => setOpenTask(null)}
        onKudos={handleKudos} currentUser={tweaks.currentUser}/>
    );
    if (screen === 'home') return <HomeScreen state={state} onComplete={handleComplete}
      onNavigate={(s) => setScreen(s)} onKudos={handleKudos}
      onOpenTask={(t) => setOpenTask(t)} currentUser={tweaks.currentUser}/>;
    if (screen === 'list') return <TaskListScreen state={state} onComplete={handleComplete}
      onOpenTask={(t) => setOpenTask(t)} onAddTask={() => {}}/>;
    if (screen === 'appreciate') return <AppreciateScreen state={state}
      onNavigate={(s) => setScreen(s)} onKudos={handleKudos} currentUser={tweaks.currentUser}/>;
    if (screen === 'analytics') return <AnalyticsScreen state={state}/>;
    return null;
  };

  const dark = tweaks.darkMode;
  const txt = dark ? '#F2ECE4' : '#2A221E';

  const TabBar = () => {
    if (openTask) return null;
    const tabs = [
      { k: 'home',       l: 'Heute',        icon: Icons.home },
      { k: 'list',       l: 'Aufgaben',     icon: Icons.list },
      { k: 'appreciate', l: 'Wertsch.',     icon: Icons.heart },
      { k: 'analytics',  l: 'Balance',      icon: Icons.chart },
    ];
    return (
      <div style={{ position: 'absolute', bottom: 12, left: 12, right: 12, zIndex: 50 }}>
        <div style={{
          background: dark ? 'rgba(40,32,36,0.82)' : 'rgba(253,248,241,0.82)',
          backdropFilter: 'blur(24px) saturate(180%)',
          WebkitBackdropFilter: 'blur(24px) saturate(180%)',
          border: dark ? '1px solid rgba(255,255,255,0.06)' : '1px solid rgba(0,0,0,0.04)',
          borderRadius: 26, padding: '10px 8px 14px',
          display: 'flex', justifyContent: 'space-around',
          boxShadow: dark ? '0 8px 28px rgba(0,0,0,0.4)' : '0 4px 20px rgba(0,0,0,0.04), 0 1px 3px rgba(0,0,0,0.03)',
        }}>
          {tabs.map(t => {
            const active = screen === t.k;
            const c = active ? 'rgb(215, 128, 96)' : (dark ? 'rgba(242,236,228,0.5)' : 'rgba(42,34,30,0.45)');
            return (
              <button key={t.k} onClick={() => setScreen(t.k)} style={{
                background: 'none', border: 'none', cursor: 'pointer',
                display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4,
                padding: '4px 10px',
              }}>
                {t.icon(22, c)}
                <span style={{
                  fontSize: 10, fontWeight: active ? 600 : 500,
                  color: c, fontFamily: 'Geist, system-ui', letterSpacing: -0.1,
                }}>{t.l}</span>
              </button>
            );
          })}
        </div>
      </div>
    );
  };

  return (
    <>
      <style>{`
        @keyframes heartRise { to { transform: translate(var(--drift), -340px) scale(0.6); opacity: 0; } }
        @keyframes petalFall { to { transform: translateY(900px) rotate(var(--rotEnd)); opacity: 0; } }
        @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      `}</style>

      <div style={{
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        gap: 32, minHeight: '100vh', padding: '40px 20px',
        background: dark
          ? 'radial-gradient(ellipse at top, rgb(34,26,30) 0%, rgb(14,12,16) 70%)'
          : 'radial-gradient(ellipse at top, rgb(248,240,230) 0%, rgb(232,222,210) 70%)',
        flexWrap: 'wrap', fontFamily: 'Geist, system-ui',
      }}>
        <IOSDevice dark={dark}>
          <WarmBackdrop dark={dark}>
            <div style={{ position: 'relative', height: '100%', overflow: 'auto' }}>
              {renderScreen()}
              <TabBar/>
              <Petals active={showPetals}/>
              <Hearts active={showHearts} color={window.MEMBERS.find(m => m.id === tweaks.currentUser).color}/>
              {toast && (
                <div style={{
                  position: 'absolute', top: 60, left: '50%', transform: 'translateX(-50%)',
                  zIndex: 150, background: dark ? 'rgba(255,255,255,0.95)' : '#2A221E',
                  color: dark ? '#2A221E' : '#FDF8F1',
                  padding: '10px 16px', borderRadius: 999,
                  fontFamily: 'Geist, system-ui', fontSize: 13, fontWeight: 500,
                  boxShadow: '0 8px 24px rgba(0,0,0,0.18)',
                  animation: 'toastIn 0.35s cubic-bezier(.2,.8,.2,1)',
                  display: 'flex', alignItems: 'center', gap: 8, whiteSpace: 'nowrap',
                  maxWidth: '85%',
                }}>
                  {toast.kind === 'done' ? (
                    <><div style={{ width: 8, height: 8, borderRadius: '50%', background: toast.color }}/>
                    <span>{toast.task} · +{window.formatMinutes(toast.time)}</span></>
                  ) : (
                    <><Heart size={14} filled color={toast.color}/>
                    <span style={{ fontFamily: '"Instrument Serif", Georgia, serif', fontSize: 15 }}>
                      Danke an <em>{toast.name}</em>
                    </span></>
                  )}
                </div>
              )}
            </div>
          </WarmBackdrop>
        </IOSDevice>

        {tweaks.showDesktop && <DesktopShell state={state} tweaks={tweaks}/>}
      </div>

      {editMode && (
        <div style={{
          position: 'fixed', bottom: 20, right: 20, zIndex: 999,
          background: 'rgba(20,18,22,0.95)', color: 'white',
          padding: 16, borderRadius: 18, width: 240,
          backdropFilter: 'blur(20px)', boxShadow: '0 12px 40px rgba(0,0,0,0.4)',
          fontFamily: 'Geist, system-ui',
        }}>
          <div style={{ fontSize: 12, fontWeight: 700, marginBottom: 12, letterSpacing: 0.5,
            textTransform: 'uppercase', opacity: 0.7 }}>Tweaks</div>

          <div style={{ marginBottom: 12 }}>
            <div style={{ fontSize: 11, opacity: 0.7, marginBottom: 6 }}>Theme</div>
            <div style={{ display: 'flex', gap: 4 }}>
              {[['Hell', false], ['Dunkel', true]].map(([l, v]) => (
                <button key={l} onClick={() => updateTweak('darkMode', v)} style={{
                  flex: 1, padding: 8, borderRadius: 8, border: 'none', cursor: 'pointer',
                  background: tweaks.darkMode === v ? 'rgb(215, 128, 96)' : 'rgba(255,255,255,0.08)',
                  color: 'white', fontSize: 12, fontWeight: 600,
                }}>{l}</button>
              ))}
            </div>
          </div>

          <div style={{ marginBottom: 12 }}>
            <div style={{ fontSize: 11, opacity: 0.7, marginBottom: 6 }}>Aktiver User</div>
            <div style={{ display: 'flex', gap: 4 }}>
              {window.MEMBERS.map(m => (
                <button key={m.id} onClick={() => updateTweak('currentUser', m.id)} style={{
                  flex: 1, padding: 8, borderRadius: 8, border: 'none', cursor: 'pointer',
                  background: tweaks.currentUser === m.id ? m.color : 'rgba(255,255,255,0.08)',
                  color: 'white', fontSize: 12, fontWeight: 600,
                }}>{m.name}</button>
              ))}
            </div>
          </div>

          <div>
            <div style={{ fontSize: 11, opacity: 0.7, marginBottom: 6 }}>Springe zu</div>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 4 }}>
              {[
                ['home', 'Heute'], ['list', 'Aufgaben'],
                ['appreciate', 'Wertsch.'], ['analytics', 'Balance'],
              ].map(([k, l]) => (
                <button key={k} onClick={() => { setScreen(k); setOpenTask(null); }} style={{
                  padding: 6, borderRadius: 6, border: 'none', cursor: 'pointer',
                  background: screen === k && !openTask ? 'rgb(215,128,96)' : 'rgba(255,255,255,0.08)',
                  color: 'white', fontSize: 11, fontWeight: 500,
                }}>{l}</button>
              ))}
            </div>
            <button onClick={() => setOpenTask(window.TASKS[12])} style={{
              width: '100%', marginTop: 8, padding: 8, borderRadius: 8,
              border: 'none', cursor: 'pointer',
              background: 'rgba(215, 128, 96, 0.35)', color: 'white',
              fontSize: 12, fontWeight: 500,
            }}>Aufgaben-Detail öffnen</button>
          </div>
        </div>
      )}
    </>
  );
}

// Desktop companion
function DesktopShell({ state, tweaks }) {
  const dark = tweaks.darkMode;
  const monthAgo = Date.now() - 30 * 86400000;
  const lottaT = window.timeByMember(state.logs, 'lotta', monthAgo);
  const marcosT = window.timeByMember(state.logs, 'marcos', monthAgo);
  const txt = dark ? '#F2ECE4' : '#2A221E';
  const muted = dark ? 'rgba(242,236,228,0.55)' : 'rgba(42,34,30,0.55)';
  return (
    <div style={{
      width: 720, height: 480, borderRadius: 18, overflow: 'hidden',
      background: dark ? 'rgb(14,12,16)' : 'rgb(253,248,241)',
      boxShadow: '0 30px 60px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.06)',
      display: 'flex', fontFamily: 'Geist, system-ui',
    }}>
      <div style={{
        width: 200, background: dark ? 'rgb(20,18,22)' : 'rgb(248,241,232)',
        padding: 18, borderRight: dark ? '1px solid rgba(255,255,255,0.05)' : '1px solid rgba(0,0,0,0.04)',
      }}>
        <div style={{ fontFamily: '"Instrument Serif", Georgia, serif', fontSize: 22, color: txt, marginBottom: 18 }}>Home-Team</div>
        {['Heute', 'Aufgaben', 'Wertschätzung', 'Balance'].map((l, i) => (
          <div key={l} style={{
            padding: '8px 10px', borderRadius: 10, marginBottom: 2,
            background: i === 0 ? 'rgba(215,128,96,0.14)' : 'transparent',
            color: i === 0 ? 'rgb(215,128,96)' : (dark ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.7)'),
            fontSize: 13, fontWeight: i === 0 ? 600 : 500,
          }}>{l}</div>
        ))}
      </div>
      <div style={{ flex: 1, padding: 24, overflow: 'auto' }}>
        <div style={{ fontFamily: '"Instrument Serif", Georgia, serif', fontSize: 30, color: txt, letterSpacing: -0.4 }}>Hallo, Lotta.</div>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12, marginTop: 14 }}>
          {window.MEMBERS.map((m, i) => (
            <div key={m.id} style={{
              padding: 14, borderRadius: 16, background: dark ? 'rgb(30,26,30)' : '#fff',
              border: dark ? '1px solid rgba(255,255,255,0.06)' : '1px solid rgba(0,0,0,0.04)',
            }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                <Avatar member={m} size={28}/>
                <span style={{ fontSize: 13, fontWeight: 600, color: txt }}>{m.name}</span>
              </div>
              <div style={{
                fontFamily: '"Instrument Serif", Georgia, serif', fontSize: 28, color: m.color,
                lineHeight: 1, marginTop: 6, letterSpacing: -0.4,
              }}>{window.formatMinutes(i === 0 ? lottaT : marcosT)}</div>
              <div style={{ fontSize: 11, color: muted, marginTop: 4 }}>diesen Monat</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

window.App = App;



// mount
const _root = ReactDOM.createRoot(document.getElementById("root"));
_root.render(<App/>);

</script>
</body></html>
