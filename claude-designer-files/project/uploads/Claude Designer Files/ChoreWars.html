<script type="text/babel" data-presets="env,react">
// Design tokens for ChoreWars / Haushalts App

const CATEGORIES = {
  Allgemein:   { hue: 'rgb(124, 92, 255)', soft: 'rgb(238, 232, 255)', deep: 'rgb(60, 39, 152)', emoji: '✦', label: 'Allgemein' },
  Bad:         { hue: 'rgb(0, 168, 184)', soft: 'rgb(217, 244, 247)', deep: 'rgb(7, 79, 88)', emoji: '◐', label: 'Bad' },
  Küche:       { hue: 'rgb(232, 79, 50)', soft: 'rgb(255, 226, 219)', deep: 'rgb(110, 26, 8)', emoji: '◆', label: 'Küche' },
  Schlafzimmer:{ hue: 'rgb(78, 96, 196)', soft: 'rgb(225, 230, 251)', deep: 'rgb(28, 41, 110)', emoji: '☾', label: 'Schlafzimmer' },
  Wohnzimmer:  { hue: 'rgb(220, 138, 50)', soft: 'rgb(254, 235, 211)', deep: 'rgb(116, 64, 12)', emoji: '◍', label: 'Wohnzimmer' },
  Wäsche:      { hue: 'rgb(195, 86, 156)', soft: 'rgb(252, 224, 240)', deep: 'rgb(98, 27, 73)', emoji: '◊', label: 'Wäsche' },
};

// Master task list with default points and cycle days
const TASKS = [
  // Allgemein
  { id: 't1',  name: 'Altglas wegbringen',   cat: 'Allgemein', pts: 8,  cycle: 14 },
  { id: 't2',  name: 'Blumen gießen',        cat: 'Allgemein', pts: 3,  cycle: 4 },
  { id: 't3',  name: 'Blumen umtopfen',      cat: 'Allgemein', pts: 12, cycle: 90 },
  { id: 't4',  name: 'Feudeln',              cat: 'Allgemein', pts: 10, cycle: 14 },
  { id: 't5',  name: 'Oberflächen abstauben',cat: 'Allgemein', pts: 6,  cycle: 14 },
  { id: 't6',  name: 'Pfand wegbringen',     cat: 'Allgemein', pts: 5,  cycle: 10 },
  { id: 't7',  name: 'Staubsaugen',          cat: 'Allgemein', pts: 8,  cycle: 7 },
  { id: 't8',  name: 'Timi reinigen',        cat: 'Allgemein', pts: 6,  cycle: 7 },
  { id: 't9',  name: 'Wocheneinkauf',        cat: 'Allgemein', pts: 12, cycle: 7 },
  { id: 't10', name: 'Zwischendurcheinkauf', cat: 'Allgemein', pts: 4,  cycle: 3 },
  // Bad
  { id: 't11', name: 'Mülleimer leeren',     cat: 'Bad',       pts: 3,  cycle: 7 },
  { id: 't12', name: 'Bad putzen',           cat: 'Bad',       pts: 14, cycle: 10 },
  // Küche
  { id: 't13', name: 'Abwaschen',            cat: 'Küche',     pts: 5,  cycle: 1 },
  { id: 't14', name: 'Geschirrspüler ausräumen', cat: 'Küche', pts: 3,  cycle: 2 },
  { id: 't15', name: 'Kochen',               cat: 'Küche',     pts: 8,  cycle: 1 },
  { id: 't16', name: 'Kühlschrank reinigen', cat: 'Küche',     pts: 10, cycle: 30 },
  { id: 't17', name: 'Müll rausbringen',     cat: 'Küche',     pts: 4,  cycle: 4 },
  { id: 't18', name: 'Oberflächen reinigen', cat: 'Küche',     pts: 5,  cycle: 3 },
  { id: 't19', name: 'Ofen reinigen',        cat: 'Küche',     pts: 12, cycle: 60 },
  { id: 't20', name: 'Geschirr wegräumen',   cat: 'Küche',     pts: 2,  cycle: 1 },
  // Schlafzimmer
  { id: 't21', name: 'Aufräumen',            cat: 'Schlafzimmer', pts: 5, cycle: 7 },
  { id: 't22', name: 'Bettwäsche wechseln',  cat: 'Schlafzimmer', pts: 10, cycle: 14 },
  // Wohnzimmer
  { id: 't23', name: 'Aufräumen',            cat: 'Wohnzimmer', pts: 5, cycle: 5 },
  // Wäsche
  { id: 't24', name: 'Wäsche Waschen',       cat: 'Wäsche',    pts: 5,  cycle: 4 },
  { id: 't25', name: 'Wäsche Aufhängen',     cat: 'Wäsche',    pts: 4,  cycle: 4 },
  { id: 't26', name: 'Wäsche wegräumen',     cat: 'Wäsche',    pts: 4,  cycle: 5 },
];

// Members
const MEMBERS = [
  { id: 'lotta',  name: 'Lotta',  initial: 'L', color: 'rgb(232, 79, 50)',  bg: 'rgb(255, 226, 219)' },
  { id: 'marcos', name: 'Marcos', initial: 'M', color: 'rgb(78, 96, 196)',  bg: 'rgb(225, 230, 251)' },
];

// Generate plausible task log history (last 60 days)
function generateLogs() {
  const logs = [];
  const now = Date.now();
  const day = 24 * 60 * 60 * 1000;
  // Seeded "random" for stability
  let seed = 42;
  const rand = () => {
    seed = (seed * 9301 + 49297) % 233280;
    return seed / 233280;
  };
  for (let d = 60; d >= 0; d--) {
    const ts = now - d * day;
    // Each day, ~2-5 tasks happen
    const n = 2 + Math.floor(rand() * 4);
    for (let i = 0; i < n; i++) {
      const task = TASKS[Math.floor(rand() * TASKS.length)];
      // Lotta does 55%, Marcos 45%
      const member = rand() < 0.55 ? 'lotta' : 'marcos';
      logs.push({
        taskId: task.id,
        taskName: task.name,
        cat: task.cat,
        pts: task.pts,
        memberId: member,
        ts: ts - Math.floor(rand() * day),
      });
    }
  }
  return logs.sort((a,b) => b.ts - a.ts);
}

const LOGS = generateLogs();

// Compute "last done" per task (any user) and per task per user
function lastDoneByTask(logs) {
  const m = {};
  logs.forEach(l => { if (!m[l.taskId] || l.ts > m[l.taskId]) m[l.taskId] = l.ts; });
  return m;
}

function lastDoneByTaskUser(logs, uid) {
  const m = {};
  logs.filter(l => l.memberId === uid).forEach(l => {
    if (!m[l.taskId] || l.ts > m[l.taskId]) m[l.taskId] = l.ts;
  });
  return m;
}

// Season starts 21 days ago
const SEASON_START = Date.now() - 21 * 24 * 60 * 60 * 1000;
const SEASON_NUMBER = 7;

function pointsThisSeason(logs, uid) {
  return logs.filter(l => l.memberId === uid && l.ts >= SEASON_START)
    .reduce((s, l) => s + l.pts, 0);
}

function pointsAllTime(logs, uid) {
  return logs.filter(l => l.memberId === uid).reduce((s, l) => s + l.pts, 0);
}

function streakDays(logs, uid) {
  // count consecutive days with at least one log for this user, ending today
  const day = 86400000;
  const today = new Date();
  today.setHours(0,0,0,0);
  let streak = 0;
  for (let d = 0; d < 60; d++) {
    const dayStart = today.getTime() - d * day;
    const dayEnd = dayStart + day;
    const has = logs.some(l => l.memberId === uid && l.ts >= dayStart && l.ts < dayEnd);
    if (has) streak++;
    else if (d > 0) break; // allow today to be empty
  }
  return streak;
}

function timeAgo(ts) {
  const diff = Date.now() - ts;
  const days = Math.floor(diff / 86400000);
  if (days === 0) return 'heute';
  if (days === 1) return 'gestern';
  if (days < 7) return `vor ${days} T.`;
  if (days < 14) return 'letzte Woche';
  if (days < 60) return `vor ${Math.floor(days/7)} Wo.`;
  return `vor ${Math.floor(days/30)} Mon.`;
}

Object.assign(window, {
  CATEGORIES, TASKS, MEMBERS, LOGS, SEASON_START, SEASON_NUMBER,
  lastDoneByTask, lastDoneByTaskUser, pointsThisSeason, pointsAllTime,
  streakDays, timeAgo,
});


// iOS.jsx — Simplified iOS 26 (Liquid Glass) device frame
// Based on the iOS 26 UI Kit + Figma status bar spec. No assets, no deps.
// Exports: IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard

// ─────────────────────────────────────────────────────────────
// Status bar
// ─────────────────────────────────────────────────────────────
function IOSStatusBar({ dark = false, time = '9:41' }) {
  const c = dark ? '#fff' : '#000';
  return (
    <div style={{
      display: 'flex', gap: 154, alignItems: 'center', justifyContent: 'center',
      padding: '21px 24px 19px', boxSizing: 'border-box',
      position: 'relative', zIndex: 20, width: '100%',
    }}>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', paddingTop: 1.5 }}>
        <span style={{
          fontFamily: '-apple-system, "SF Pro", system-ui', fontWeight: 590,
          fontSize: 17, lineHeight: '22px', color: c,
        }}>{time}</span>
      </div>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7, paddingTop: 1, paddingRight: 1 }}>
        <svg width="19" height="12" viewBox="0 0 19 12">
          <rect x="0" y="7.5" width="3.2" height="4.5" rx="0.7" fill={c}/>
          <rect x="4.8" y="5" width="3.2" height="7" rx="0.7" fill={c}/>
          <rect x="9.6" y="2.5" width="3.2" height="9.5" rx="0.7" fill={c}/>
          <rect x="14.4" y="0" width="3.2" height="12" rx="0.7" fill={c}/>
        </svg>
        <svg width="17" height="12" viewBox="0 0 17 12">
          <path d="M8.5 3.2C10.8 3.2 12.9 4.1 14.4 5.6L15.5 4.5C13.7 2.7 11.2 1.5 8.5 1.5C5.8 1.5 3.3 2.7 1.5 4.5L2.6 5.6C4.1 4.1 6.2 3.2 8.5 3.2Z" fill={c}/>
          <path d="M8.5 6.8C9.9 6.8 11.1 7.3 12 8.2L13.1 7.1C11.8 5.9 10.2 5.1 8.5 5.1C6.8 5.1 5.2 5.9 3.9 7.1L5 8.2C5.9 7.3 7.1 6.8 8.5 6.8Z" fill={c}/>
          <circle cx="8.5" cy="10.5" r="1.5" fill={c}/>
        </svg>
        <svg width="27" height="13" viewBox="0 0 27 13">
          <rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke={c} strokeOpacity="0.35" fill="none"/>
          <rect x="2" y="2" width="20" height="9" rx="2" fill={c}/>
          <path d="M25 4.5V8.5C25.8 8.2 26.5 7.2 26.5 6.5C26.5 5.8 25.8 4.8 25 4.5Z" fill={c} fillOpacity="0.4"/>
        </svg>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Liquid glass pill — blur + tint + shine
// ─────────────────────────────────────────────────────────────
function IOSGlassPill({ children, dark = false, style = {} }) {
  return (
    <div style={{
      height: 44, minWidth: 44, borderRadius: 9999,
      position: 'relative', overflow: 'hidden',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      boxShadow: dark
        ? '0 2px 6px rgba(0,0,0,0.35), 0 6px 16px rgba(0,0,0,0.2)'
        : '0 1px 3px rgba(0,0,0,0.07), 0 3px 10px rgba(0,0,0,0.06)',
      ...style,
    }}>
      {/* blur + tint */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.28)' : 'rgba(255,255,255,0.5)',
      }} />
      {/* shine */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15), inset -1px -1px 1px rgba(255,255,255,0.08)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
      }} />
      <div style={{ position: 'relative', zIndex: 1, display: 'flex', alignItems: 'center', padding: '0 4px' }}>
        {children}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Navigation bar — glass pills + large title
// ─────────────────────────────────────────────────────────────
function IOSNavBar({ title = 'Title', dark = false, trailingIcon = true }) {
  const muted = dark ? 'rgba(255,255,255,0.6)' : '#404040';
  const text = dark ? '#fff' : '#000';
  const pillIcon = (content) => (
    <IOSGlassPill dark={dark}>
      <div style={{ width: 36, height: 36, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        {content}
      </div>
    </IOSGlassPill>
  );
  return (
    <div style={{
      display: 'flex', flexDirection: 'column', gap: 10,
      paddingTop: 62, paddingBottom: 10, position: 'relative', zIndex: 5,
    }}>
      <div style={{
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        padding: '0 16px',
      }}>
        {/* back chevron */}
        {pillIcon(
          <svg width="12" height="20" viewBox="0 0 12 20" fill="none" style={{ marginLeft: -1 }}>
            <path d="M10 2L2 10l8 8" stroke={muted} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        )}
        {/* trailing ellipsis */}
        {trailingIcon && pillIcon(
          <svg width="22" height="6" viewBox="0 0 22 6">
            <circle cx="3" cy="3" r="2.5" fill={muted}/>
            <circle cx="11" cy="3" r="2.5" fill={muted}/>
            <circle cx="19" cy="3" r="2.5" fill={muted}/>
          </svg>
        )}
      </div>
      {/* large title */}
      <div style={{
        padding: '0 16px',
        fontFamily: '-apple-system, system-ui',
        fontSize: 34, fontWeight: 700, lineHeight: '41px',
        color: text, letterSpacing: 0.4,
      }}>{title}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Grouped list (inset card, r:26) + row (52px)
// ─────────────────────────────────────────────────────────────
function IOSListRow({ title, detail, icon, chevron = true, isLast = false, dark = false }) {
  const text = dark ? '#fff' : '#000';
  const sec = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const ter = dark ? 'rgba(235,235,245,0.3)' : 'rgba(60,60,67,0.3)';
  const sep = dark ? 'rgba(84,84,88,0.65)' : 'rgba(60,60,67,0.12)';
  return (
    <div style={{
      display: 'flex', alignItems: 'center', minHeight: 52,
      padding: '0 16px', position: 'relative',
      fontFamily: '-apple-system, system-ui', fontSize: 17,
      letterSpacing: -0.43,
    }}>
      {icon && (
        <div style={{
          width: 30, height: 30, borderRadius: 7, background: icon,
          marginRight: 12, flexShrink: 0,
        }} />
      )}
      <div style={{ flex: 1, color: text }}>{title}</div>
      {detail && <span style={{ color: sec, marginRight: 6 }}>{detail}</span>}
      {chevron && (
        <svg width="8" height="14" viewBox="0 0 8 14" style={{ flexShrink: 0 }}>
          <path d="M1 1l6 6-6 6" stroke={ter} strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      )}
      {!isLast && (
        <div style={{
          position: 'absolute', bottom: 0, right: 0,
          left: icon ? 58 : 16, height: 0.5, background: sep,
        }} />
      )}
    </div>
  );
}

function IOSList({ header, children, dark = false }) {
  const hc = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const bg = dark ? '#1C1C1E' : '#fff';
  return (
    <div>
      {header && (
        <div style={{
          fontFamily: '-apple-system, system-ui', fontSize: 13,
          color: hc, textTransform: 'uppercase',
          padding: '8px 36px 6px', letterSpacing: -0.08,
        }}>{header}</div>
      )}
      <div style={{
        background: bg, borderRadius: 26,
        margin: '0 16px', overflow: 'hidden',
      }}>{children}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Device frame
// ─────────────────────────────────────────────────────────────
function IOSDevice({
  children, width = 402, height = 874, dark = false,
  title, keyboard = false,
}) {
  return (
    <div style={{
      width, height, borderRadius: 48, overflow: 'hidden',
      position: 'relative', background: dark ? '#000' : '#F2F2F7',
      boxShadow: '0 40px 80px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.12)',
      fontFamily: '-apple-system, system-ui, sans-serif',
      WebkitFontSmoothing: 'antialiased',
    }}>
      {/* dynamic island */}
      <div style={{
        position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)',
        width: 126, height: 37, borderRadius: 24, background: '#000', zIndex: 50,
      }} />
      {/* status bar (absolute) */}
      <div style={{ position: 'absolute', top: 0, left: 0, right: 0, zIndex: 10 }}>
        <IOSStatusBar dark={dark} />
      </div>
      {/* nav + content */}
      <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
        {title !== undefined && <IOSNavBar title={title} dark={dark} />}
        <div style={{ flex: 1, overflow: 'auto' }}>{children}</div>
        {keyboard && <IOSKeyboard dark={dark} />}
      </div>
      {/* home indicator — always on top */}
      <div style={{
        position: 'absolute', bottom: 0, left: 0, right: 0, zIndex: 60,
        height: 34, display: 'flex', justifyContent: 'center', alignItems: 'flex-end',
        paddingBottom: 8, pointerEvents: 'none',
      }}>
        <div style={{
          width: 139, height: 5, borderRadius: 100,
          background: dark ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.25)',
        }} />
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Keyboard — iOS 26 liquid glass
// ─────────────────────────────────────────────────────────────
function IOSKeyboard({ dark = false }) {
  const glyph = dark ? 'rgba(255,255,255,0.7)' : '#595959';
  const sugg = dark ? 'rgba(255,255,255,0.6)' : '#333';
  const keyBg = dark ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.85)';

  // special-key icons
  const icons = {
    shift: <svg width="19" height="17" viewBox="0 0 19 17"><path d="M9.5 1L1 9.5h4.5V16h8V9.5H18L9.5 1z" fill={glyph}/></svg>,
    del: <svg width="23" height="17" viewBox="0 0 23 17"><path d="M7 1h13a2 2 0 012 2v11a2 2 0 01-2 2H7l-6-7.5L7 1z" fill="none" stroke={glyph} strokeWidth="1.6" strokeLinejoin="round"/><path d="M10 5l7 7M17 5l-7 7" stroke={glyph} strokeWidth="1.6" strokeLinecap="round"/></svg>,
    ret: <svg width="20" height="14" viewBox="0 0 20 14"><path d="M18 1v6H4m0 0l4-4M4 7l4 4" fill="none" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  };

  const key = (content, { w, flex, ret, fs = 25, k } = {}) => (
    <div key={k} style={{
      height: 42, borderRadius: 8.5,
      flex: flex ? 1 : undefined, width: w, minWidth: 0,
      background: ret ? '#08f' : keyBg,
      boxShadow: '0 1px 0 rgba(0,0,0,0.075)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontFamily: '-apple-system, "SF Compact", system-ui',
      fontSize: fs, fontWeight: 458, color: ret ? '#fff' : glyph,
    }}>{content}</div>
  );

  const row = (keys, pad = 0) => (
    <div style={{ display: 'flex', gap: 6.5, justifyContent: 'center', padding: `0 ${pad}px` }}>
      {keys.map(l => key(l, { flex: true, k: l }))}
    </div>
  );

  return (
    <div style={{
      position: 'relative', zIndex: 15, borderRadius: 27, overflow: 'hidden',
      padding: '11px 0 2px',
      display: 'flex', flexDirection: 'column', alignItems: 'center',
      boxShadow: dark
        ? '0 -2px 20px rgba(0,0,0,0.09)'
        : '0 -1px 6px rgba(0,0,0,0.018), 0 -3px 20px rgba(0,0,0,0.012)',
    }}>
      {/* liquid glass bg — same recipe as nav pills */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.14)' : 'rgba(255,255,255,0.25)',
      }} />
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',

// Progress ring (SVG)
function Ring({ size = 60, stroke = 6, progress = 0.7, color = '#7C5CFF', track = '#EEE', children }) {
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  return (
    <div style={{ position: 'relative', width: size, height: size }}>
      <svg width={size} height={size} style={{ transform: 'rotate(-90deg)' }}>
        <circle cx={size/2} cy={size/2} r={r} stroke={track} strokeWidth={stroke} fill="none" />
        <circle cx={size/2} cy={size/2} r={r} stroke={color} strokeWidth={stroke} fill="none"
          strokeDasharray={c} strokeDashoffset={c * (1 - progress)}
          strokeLinecap="round"
          style={{ transition: 'stroke-dashoffset 0.6s cubic-bezier(.2,.8,.2,1)' }}/>
      </svg>
      {children && (
        <div style={{
          position: 'absolute', inset: 0,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
        }}>{children}</div>
      )}
    </div>
  );
}

// Confetti — playing card sized, falling
function Confetti({ active, count = 80 }) {
  const [pieces] = React.useState(() =>
    Array.from({ length: count }, (_, i) => ({
      id: i,
      x: Math.random() * 100,
      delay: Math.random() * 0.4,
      dur: 1.2 + Math.random() * 1.4,
      color: ['#E84F32', '#7C5CFF', '#00A8B8', '#DC8A32', '#C3569C', '#4E60C4', '#FFD03A'][Math.floor(Math.random() * 7)],
      size: 6 + Math.random() * 8,
      rot: Math.random() * 360,
      rotEnd: Math.random() * 720 - 360,
      shape: Math.random() > 0.5 ? 'rect' : 'circle',
    }))
  );
  if (!active) return null;
  return (
    <div style={{ position: 'absolute', inset: 0, overflow: 'hidden', pointerEvents: 'none', zIndex: 200 }}>
      {pieces.map(p => (
        <div key={p.id} style={{
          position: 'absolute', top: -20, left: `${p.x}%`,
          width: p.size, height: p.shape === 'rect' ? p.size * 0.6 : p.size,
          background: p.color,
          borderRadius: p.shape === 'circle' ? '50%' : 2,
          animation: `confetti-fall ${p.dur}s ${p.delay}s cubic-bezier(.4,.6,.7,1) forwards`,
          transform: `rotate(${p.rot}deg)`,
          ['--rotEnd']: `${p.rotEnd}deg`,
        }} />
      ))}
    </div>
  );
}

function TaskCard({ task, dark, onComplete, showOwner = false }) {
  const cat = window.CATEGORIES[task.cat];
  const [done, setDone] = React.useState(false);
  const [pressed, setPressed] = React.useState(false);

  const handle = () => {
    if (done) return;
    setDone(true);
    setTimeout(() => onComplete(task), 300);
  };

  const overdue = task.overdueDays > 0;
  const lastTxt = task.last ? window.timeAgo(task.last) : 'noch nie';

  return (
    <div style={{
      background: dark ? 'rgb(28,28,36)' : '#fff',
      borderRadius: 20, padding: '14px 14px 14px 14px',
      display: 'flex', alignItems: 'center', gap: 14,
      border: dark ? '1px solid rgba(255,255,255,0.06)' : '1px solid rgba(0,0,0,0.04)',
      boxShadow: dark ? 'none' : '0 1px 2px rgba(0,0,0,0.03), 0 4px 12px rgba(0,0,0,0.025)',
      opacity: done ? 0.5 : 1,
      transform: done ? 'scale(0.97)' : 'scale(1)',
      transition: 'all 0.3s cubic-bezier(.2,.8,.2,1)',
    }}>
      <CategoryDot cat={task.cat} size={40} />
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{
          fontFamily: 'Geist, system-ui', fontSize: 15, fontWeight: 600,
          color: dark ? '#fff' : '#111', letterSpacing: -0.2,
          textDecoration: done ? 'line-through' : 'none',
        }}>{task.name}</div>
        <div style={{
          marginTop: 3, display: 'flex', alignItems: 'center', gap: 8,
          fontSize: 12, color: dark ? 'rgba(255,255,255,0.5)' : 'rgba(0,0,0,0.5)',
          fontFamily: 'Geist, system-ui',
        }}>
          <span>{cat.label}</span>
          <span>·</span>
          <span style={{ color: overdue ? 'rgb(232,79,50)' : 'inherit', fontWeight: overdue ? 600 : 400 }}>
            {overdue ? `${Math.floor(task.overdueDays)}d überfällig` : `zuletzt ${lastTxt}`}
          </span>
        </div>
      </div>
      <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 6 }}>
        <div style={{
          fontFamily: '"Instrument Serif", Georgia, serif', fontSize: 22,
          color: cat.hue, lineHeight: 1, letterSpacing: -0.5,
        }}>+{task.pts}</div>
        <button
          onMouseDown={() => setPressed(true)}
          onMouseUp={() => setPressed(false)}
          onMouseLeave={() => setPressed(false)}
          onClick={handle}
          style={{
            border: 'none', cursor: 'pointer',
            width: 36, height: 36, borderRadius: '50%',
            background: done ? 'rgb(46, 184, 92)' : cat.hue,
            color: 'white', display: 'flex', alignItems: 'center', justifyContent: 'center',
            transform: pressed ? 'scale(0.92)' : 'scale(1)',
            transition: 'transform 0.15s, background 0.3s',
            boxShadow: `0 4px 14px ${cat.hue.replace('rgb', 'rgba').replace(')', ', 0.45)')}`,
          }}
        >
          {Icons.check(18, 'white', 3)}
        </button>
      </div>
    </div>
  );
}

// Dashboard screen + Season-winner ceremony + Onboarding

function DashboardScreen({ state, onNavigate }) {
  const [period, setPeriod] = React.useState('30');
  const days = parseInt(period);
  const now = Date.now();
  const cutoff = now - days * 86400000;
  const filtered = state.logs.filter(l => l.ts >= cutoff);

  const lottaPts = filtered.filter(l => l.memberId === 'lotta').reduce((s,l) => s+l.pts, 0);
  const marcosPts = filtered.filter(l => l.memberId === 'marcos').reduce((s,l) => s+l.pts, 0);
  const total = lottaPts + marcosPts || 1;

  // Build sparkline data — points per day per user
  const dayData = [];
  for (let d = days - 1; d >= 0; d--) {
    const start = now - (d+1) * 86400000;
    const end = now - d * 86400000;
    const l = state.logs.filter(x => x.memberId === 'lotta' && x.ts >= start && x.ts < end).reduce((s,x) => s+x.pts, 0);
    const m = state.logs.filter(x => x.memberId === 'marcos' && x.ts >= start && x.ts < end).reduce((s,x) => s+x.pts, 0);
    dayData.push({ l, m });
  }
  // cumulative
  let cl = 0, cm = 0;
  const cum = dayData.map(d => { cl += d.l; cm += d.m; return { l: cl, m: cm }; });
  const maxCum = Math.max(...cum.map(d => Math.max(d.l, d.m)), 1);

  // Category breakdown
  const catBreakdown = {};
  filtered.forEach(l => {
    catBreakdown[l.cat] = (catBreakdown[l.cat] || 0) + l.pts;
  });
  const catSorted = Object.entries(catBreakdown).sort((a,b) => b[1] - a[1]);
  const catTotal = catSorted.reduce((s, [_,v]) => s+v, 0) || 1;

  // Heatmap — last 28 days, intensity per day
  const heat = [];
  for (let d = 27; d >= 0; d--) {
    const start = now - (d+1) * 86400000;
    const end = now - d * 86400000;
    const cnt = state.logs.filter(x => x.ts >= start && x.ts < end).length;
    heat.push(cnt);
  }
  const maxHeat = Math.max(...heat, 1);

  const W = 330, H = 130;

  return (
    <div style={{ paddingBottom: 120 }}>
      <div style={{ padding: '60px 24px 0' }}>
        <div style={{
          fontFamily: 'Geist, system-ui', fontSize: 13, fontWeight: 500,
          color: state.dark ? 'rgba(255,255,255,0.5)' : 'rgba(0,0,0,0.5)',
          letterSpacing: 0.4, textTransform: 'uppercase',
        }}>Rückblick · letzte {days} Tage</div>
        <div style={{
          fontFamily: '"Instrument Serif", Georgia, serif',
          fontSize: 38, lineHeight: 1.05, letterSpacing: -0.5,
          color: state.dark ? '#fff' : '#111', marginTop: 4,
        }}>Statistik</div>
      </div>

      {/* Period selector */}
      <div style={{ padding: '16px 16px 0', display: 'flex', gap: 6 }}>
        {[['7','7T'],['30','30T'],['90','Quartal'],['365','Jahr']].map(([k,l]) => (
          <button key={k} onClick={() => setPeriod(k)} style={{
            flex: 1, padding: '8px', border: 'none', cursor: 'pointer',
            borderRadius: 12,
            background: period === k
              ? (state.dark ? '#fff' : '#111')
              : (state.dark ? 'rgba(255,255,255,0.07)' : 'rgba(0,0,0,0.04)'),
            color: period === k
              ? (state.dark ? '#000' : '#fff')
              : (state.dark ? 'rgba(255,255,255,0.65)' : 'rgba(0,0,0,0.6)'),
            fontFamily: 'Geist, system-ui', fontWeight: 600, fontSize: 12,
          }}>{l}</button>
        ))}
      </div>

      {/* Verlauf chart */}
      <div style={{
        margin: '16px 16px 0', padding: '18px 16px',
        background: state.dark ? 'rgb(28,28,36)' : '#fff',
        borderRadius: 24,
        border: state.dark ? '1px solid rgba(255,255,255,0.06)' : '1px solid rgba(0,0,0,0.04)',
      }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 8 }}>
          <div>
            <div style={{
              fontFamily: 'Geist, system-ui', fontSize: 12, fontWeight: 600,
              color: state.dark ? 'rgba(255,255,255,0.55)' : 'rgba(0,0,0,0.5)',
              textTransform: 'uppercase', letterSpacing: 0.5,
            }}>Verlauf</div>
            <div style={{
              fontFamily: '"Instrument Serif", Georgia, serif', fontSize: 28,
              color: state.dark ? '#fff' : '#111', lineHeight: 1, marginTop: 4,
              letterSpacing: -0.5,
            }}>{lottaPts + marcosPts} Punkte gesamt</div>
          </div>
          <div style={{ display: 'flex', gap: 10, marginTop: 4 }}>
            {window.MEMBERS.map(m => (
              <div key={m.id} style={{ display: 'flex', alignItems: 'center', gap: 4 }}>

              </div>
            ))}
          </div>
        </div>
        <svg width={W} height={H} style={{ display: 'block', marginTop: 6, overflow: 'visible' }}>
          {/* grid */}
          {[0, 0.5, 1].map(y => (
            <line key={y} x1={0} x2={W} y1={H * y} y2={H * y}

          ))}
          {/* lines */}
          {['l','m'].map(key => {
            const c = key === 'l' ? window.MEMBERS[0].color : window.MEMBERS[1].color;
            const pts = cum.map((d,i) => `${(i / (cum.length-1)) * W},${H - (d[key]/maxCum) * H}`).join(' ');
            const area = `M0,${H} L${pts.split(' ').join(' L')} L${W},${H} Z`;

        </div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(28, 1fr)', gap: 3 }}>
          {heat.map((cnt, i) => {
            const intensity = cnt > 0 ? 0.2 + (cnt / maxHeat) * 0.8 : 0.05;
            return (
              <div key={i} style={{
                aspectRatio: '1', borderRadius: 3,
                background: cnt > 0

                  : (state.dark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.04)'),

            );
          })}
        </div>
      </div>

      {/* Insights */}
      <div style={{ padding: '16px', margin: '8px 0 0' }}>
        <div style={{
          background: state.dark

          }}>
            <em>{catSorted[0]?.[0]}</em> macht <em>{Math.round((catSorted[0]?.[1] || 0)/catTotal*100)}%</em> der
            Punkte aus — gefolgt von {catSorted[1]?.[0]}.
          </div>
        </div>
      </div>
    </div>
  );
}

function Donut({ a, b, ca, cb, size = 100 }) {
  const total = a + b || 1;
  const r = size / 2 - 8;
  const c = 2 * Math.PI * r;
  const aFrac = a / total;
  return (
    <svg width={size} height={size}>
      <g transform={`rotate(-90 ${size/2} ${size/2})`}>
        <circle cx={size/2} cy={size/2} r={r} stroke={cb} strokeWidth="14" fill="none"/>
        <circle cx={size/2} cy={size/2} r={r} stroke={ca} strokeWidth="14" fill="none"
          strokeDasharray={`${c * aFrac} ${c}`}/>
      </g>
      <text x={size/2} y={size/2 + 5} textAnchor="middle"
        fontFamily="'Instrument Serif', Georgia, serif" fontSize="22" fill="currentColor">
        {Math.round(aFrac * 100)}%
      </text>
    </svg>
  );
}

  const [tweaks, setTweaks] = React.useState(TWEAK_DEFAULTS);
  const [editMode, setEditMode] = React.useState(false);
  const [screen, setScreen] = React.useState(() => {
    return localStorage.getItem('cw-screen') || 'onboarding';
  });
  const [logs, setLogs] = React.useState(window.LOGS);
  const [showConfetti, setShowConfetti] = React.useState(false);
  const [toast, setToast] = React.useState(null);
  const [showCeremony, setShowCeremony] = React.useState(false);

  React.useEffect(() => {
    localStorage.setItem('cw-screen', screen);
  }, [screen]);

  // Tweaks bridge
  React.useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setEditMode(true);
      else if (e.data?.type === '__deactivate_edit_mode') setEditMode(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  const updateTweak = (k, v) => {
    const next = { ...tweaks, [k]: v };
    setTweaks(next);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [k]: v } }, '*');
  };

  const state = { logs, dark: tweaks.darkMode };

  const handleComplete = (task) => {
    const newLog = {
      taskId: task.id, taskName: task.name, cat: task.cat,
      pts: task.pts, memberId: tweaks.currentUser, ts: Date.now(),
    };
    setLogs(prev => [newLog, ...prev]);
    setShowConfetti(true);
    setTimeout(() => setShowConfetti(false), 2500);
    const me = window.MEMBERS.find(m => m.id === tweaks.currentUser);
    setToast({ task: task.name, pts: task.pts, color: window.CATEGORIES[task.cat].hue, member: me });
    setTimeout(() => setToast(null), 2800);

              fontSize: 12, fontWeight: 600,
            }}>🏁 Saison-Krönung zeigen</button>
          </div>
        </div>
      )}
    </>
  );
}
